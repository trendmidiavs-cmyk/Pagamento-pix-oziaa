<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Pagamento via Pix | OZIA
  </title>
  <style>
   * {
  box-sizing:border-box;
}
body {
  margin:0;
  background:#f4f2ed;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  min-height:100vh;
  padding:24px;
}
.card {
  width:100%;
  max-width:520px;
  background:#fff;
  border:1px solid #111;
  box-shadow:0 14px 35px rgba(0,0,0,.12);
}
.top {
  background:#0b0b0b;
  color:#fff;
  padding:28px 26px;
  text-align:center;
}
.logo {
  width:120px;
  height:120px;
  object-fit:contain;
  margin-bottom:10px;
}
.brand {
  font-size:42px;
  letter-spacing:12px;
  margin-left:12px;
  font-weight:300;
}
.title {
  font-size:17px;
  letter-spacing:4px;
  margin-top:18px;
}
.content {
  padding:28px;
}
.label {
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#666;
  margin-bottom:8px;
}
.key {
  font-size:24px;
  font-weight:700;
  letter-spacing:1px;
  word-break:break-all;
}
.box {
  border:1px solid #c9c4ba;
  padding:18px;
  margin:18px 0;
  background:#faf9f6;
}
.row {
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:8px 0;
  border-bottom:1px solid #e2dfd8;
}
.row:last-child {
  border-bottom:0;
}
.row span:first-child {
  color:#666;
}
.row span:last-child {
  text-align:right;
  font-weight:600;
}
.btn {
  width:100%;
  border:0;
  background:#0b0b0b;
  color:#fff;
  padding:16px;
  font-size:16px;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  margin-top:14px;
}
.btn.secondary {
  background:#e7e1d8;
  color:#111;
}
.status {
  text-align:center;
  min-height:22px;
  margin-top:10px;
  font-size:13px;
  color:#555;
}
.footer {
  background:#0b0b0b;
  color:#fff;
  text-align:center;
  padding:15px;
  font-size:12px;
  letter-spacing:2px;
}
.note {
  text-align:center;
  color:#666;
  font-size:13px;
  line-height:1.5;
  margin:22px 0 0;
}
  </style>
